name: ci

# Branches and pull requests only: a version tag is handled by `release`, which runs the same tests before it publishes anything.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # The tool is meant to be publishable as a single native binary. This proves it on each operating system, and runs the same
  # end-to-end scenarios against that binary instead of the framework-dependent build. `release` does the same for every target.
  native:
    name: native AOT (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: ./.github/actions/publish-native
        with:
          rid: ${{ matrix.rid }}

  pack:
    name: pack the dotnet tool
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet pack src/EnvSync.Cli -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: EnvSync.Tool
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 14
