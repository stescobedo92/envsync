name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool must behave the same on the three operating systems it targets.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build envsync.slnx -c Release

      # Do not add --nologo here: on the .NET 10 SDK it is forwarded to the xUnit v3 host, which rejects it,
      # and the run reports "Zero tests ran".
      - name: Test
        run: dotnet test --solution envsync.slnx -c Release --no-build

  pack:
    name: pack the dotnet tool
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet pack src/EnvSync.Cli -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: EnvSync.Tool
          path: artifacts/*.nupkg
