name: test

# Reusable: the build and the whole test suite on each operating system the tool targets. `ci` and `release` both call it, so a
# release can never be cut from code that has not passed exactly what every push has to pass.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The tool must behave the same on the three operating systems it targets.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build envsync.slnx -c Release

      # Do not add --nologo here: on the .NET 10 SDK it is forwarded to the xUnit v3 host, which rejects it,
      # and the run reports "Zero tests ran".
      - name: Test
        run: dotnet test --solution envsync.slnx -c Release --no-build
